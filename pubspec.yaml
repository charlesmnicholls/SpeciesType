name: species_check
description: TCC Species Check - quick volunteer check of tree species against the database.
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  http: ^1.2.1
  # CSV export of results: write to a temp file, then the Android share sheet
  path_provider: ^2.1.1
  share_plus: ^10.1.4
  vibration: ^3.1.3
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
